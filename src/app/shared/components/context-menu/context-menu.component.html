@if (visible()) {
  <div
    class="context-menu"
    [style.left.px]="position().x"
    [style.top.px]="position().y"
  >
    @for (item of menuProps(); track $index) {

      <button
        type="button"
        class="menu-item"
        (click)="onItemClick($event, item)"
      > 
        @if (item.icon) {
          <span class="menu-icon iconfont " [class]="item.icon"></span>
        }
        <span class="menu-title">{{ item.title }}</span>
      </button>
    }
  </div>
}
